name: Android Release APK

# Builds a signed release APK from the native Kotlin app (apps/mobile) and attaches
# it to the matching GitHub Release, so the self-hosted F-Droid repo (deranjer/fdroid) can
# pick it up. Unlike the RN app, this is a plain Gradle Android project with no large native
# libraries, so it ships as a SINGLE universal APK (no per-ABI splits needed).
#
# The web app is built and copied into the APK's assets (the note/canvas editor WebView).
# Signing uses the SAME release keystore as the old RN app (ANDROID_KEYSTORE_* secrets) so
# the app id `com.deranjer.nodeira` upgrades cleanly.
#
# This is a reusable workflow. release.yml calls it (workflow_call) right after semantic-release
# cuts a tag, so every release produces an APK automatically. It is NOT triggered by `push: tags`
# because semantic-release pushes the tag with the default GITHUB_TOKEN, which by design does not
# trigger downstream workflows. workflow_dispatch is kept for rebuilding an arbitrary tag on demand.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.9.0)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.9.0; blank = latest v*)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-kotlin-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Full history + tags so the dispatch fallback can pick the latest tag by semver.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        run: |
          TAG='${{ inputs.tag }}'
          # No explicit tag (manual dispatch with blank input): take the highest v* tag.
          # Resolve from git tags, not `gh release list` — a tag may exist before its
          # GitHub Release does, and tag order is semver-correct.
          if [ -z "$TAG" ]; then
            TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No v* tag found to build" && exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TAG"

      # Build the exact tagged commit (mirrors the cli/desktop jobs in release.yml),
      # not whatever ref this workflow happened to be invoked against.
      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Derive versionName / versionCode from tag
        id: ver
        run: |
          V="${{ steps.tag.outputs.tag }}"
          V="${V#v}"
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA%%-*}
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # Monotonic across releases; F-Droid requires increasing versionCode.
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app (editor bundle)
        run: pnpm --filter @nodeira/web build

      - name: Copy web build into Android assets
        run: |
          DST=apps/mobile/app/src/main/assets/web
          rm -rf "$DST" && mkdir -p "$DST"
          cp -r apps/web/dist/. "$DST/"
          test -f "$DST/index.html" || { echo "::error::web build missing"; exit 1; }

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mobile

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        working-directory: apps/mobile
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & verify APK
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          APK=apps/mobile/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK not found at $APK"; exit 1; }
          mkdir -p signed
          cp "$APK" "signed/nodeira-$VERSION.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "signed/nodeira-$VERSION.apk"
          ls -la signed/

      - name: Create release if missing & attach APK
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Automated release for $TAG"
          fi
          gh release upload "$TAG" signed/nodeira-"$VERSION".apk --repo "$GITHUB_REPOSITORY" --clobber
