name: Android Release APK

# Builds a signed release APK from the Expo app (apps/mobile) and attaches it to
# the matching GitHub Release, so the self-hosted F-Droid repo (deranjer/fdroid)
# can pick it up. F-Droid does not build from source — it only indexes prebuilt,
# signed APKs pulled from Releases.
#
# We build WITHOUT EAS: `expo prebuild` generates the native android/ project and
# Gradle assembles the APK. The release is signed after the fact with apksigner
# using a stable release keystore (Expo's generated Gradle would otherwise
# debug-sign release builds, which breaks app updates across versions).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.7.0; blank = latest v*)
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target tag
        id: tag
        run: |
          TAG='${{ inputs.tag }}'
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft \
              -q '[.[] | select(.isDraft | not) | .tagName | select(startswith("v"))][0]')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No v* release tag found to build" && exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target tag: $TAG"

      - name: Derive versionName / versionCode from tag
        id: ver
        run: |
          V="${{ steps.tag.outputs.tag }}"
          V="${V#v}"                 # strip leading v
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA%%-*}               # drop prerelease suffix (e.g. 1.2.0-beta.1)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # Monotonic across releases; F-Droid requires increasing versionCode.
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # No `cache: gradle` here: the android/ project doesn't exist yet
          # (it's generated by expo prebuild below), so setup-java would find no
          # gradle files and fail. Gradle caching is set up after prebuild.

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Workspace install so the monorepo (shared-types, metro overrides) resolves.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --no-install: deps are already installed by pnpm above; prebuild's own
      # npm install would clobber the hoisted pnpm layout the metro config relies on.
      - name: Expo prebuild (generate android/)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Gradle dependency caching, keyed off the now-generated android/ files.
      # Must come after prebuild — the project doesn't exist before this point.
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/mobile/android

      # Expo hardcodes versionCode/versionName into the generated Gradle from
      # app.json. Override them from the release tag so each release is unique.
      - name: Inject versionName / versionCode
        working-directory: apps/mobile/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.ver.outputs.code }}/" build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.name }}\"/" build.gradle
          grep -nE "versionCode|versionName" build.gradle

      - name: Assemble release APK
        working-directory: apps/mobile/android
        # EXPO_NO_METRO_WORKSPACE_ROOT keeps Metro's server root at apps/mobile to
        # match the traditional metro.config.js (also set in apps/mobile/.env).
        env:
          EXPO_NO_METRO_WORKSPACE_ROOT: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Re-sign each per-ABI APK with the stable release key (Expo debug-signs
      # release builds by default). The withAbiSplits config plugin produces
      # app-<abi>-release.apk with distinct versionCodes.
      - name: Zipalign & sign per-ABI APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          OUT="apps/mobile/android/app/build/outputs/apk/release"
          mkdir -p signed
          shopt -s nullglob
          apks=("$OUT"/app-*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No per-ABI APKs found in $OUT (expected app-<abi>-release.apk)" && exit 1
          fi
          for apk in "${apks[@]}"; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-(.*)-release$/\1/')
            "$BT/zipalign" -f -p 4 "$apk" "aligned-$abi.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "signed/nodeira-$VERSION-$abi.apk" "aligned-$abi.apk"
            "$BT/apksigner" verify "signed/nodeira-$VERSION-$abi.apk"
          done
          ls -la signed/

      - name: Create release if missing & attach APKs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Automated release for $TAG"
          fi
          gh release upload "$TAG" signed/nodeira-"$VERSION"-*.apk --repo "$GITHUB_REPOSITORY" --clobber
