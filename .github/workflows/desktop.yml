name: Desktop

# A full three-OS Electron package on every PR touching apps/web -- which is most PRs --
# duplicated what the release pipeline already does and cost roughly six runner-minutes a
# push. PRs now build only when the desktop app itself changes; pushes to main keep the
# wider net, since that is what feeds a release.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/desktop/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @nodeira/web run build

      - name: Build desktop (Electron Forge)
        run: pnpm --filter @nodeira/desktop run build

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/out/
          retention-days: 7
