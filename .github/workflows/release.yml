name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        required: true
        type: choice
        options:
          - "linux/amd64,linux/arm64"
          - "linux/amd64"
          - "linux/arm64"
        default: "linux/amd64,linux/arm64"
      version:
        description: "Image version tag (without v prefix; defaults to latest git tag)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      desktop_changed: ${{ steps.release.outputs.desktop_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        id: release
        run: |
          BEFORE_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1 || echo "")
          ./node_modules/.bin/semantic-release
          git fetch --tags --force origin
          AFTER_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1 || echo "")
          if [ "$AFTER_TAG" != "$BEFORE_TAG" ] && [ -n "$AFTER_TAG" ]; then
            echo "version=${AFTER_TAG#v}" >> $GITHUB_OUTPUT
            if [ -z "$BEFORE_TAG" ]; then
              echo "desktop_changed=true" >> $GITHUB_OUTPUT
            else
              CHANGED=$(git diff --name-only "$BEFORE_TAG" "$AFTER_TAG" -- apps/web apps/desktop)
              if [ -n "$CHANGED" ]; then
                echo "desktop_changed=true" >> $GITHUB_OUTPUT
              fi
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-setup:
    needs: [release]
    if: |
      always() && (
        (needs.release.result == 'success' && needs.release.outputs.version != '') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      matrix: ${{ steps.matrix.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
            else
              git fetch --tags
              LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1 || echo "")
              echo "value=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
            fi
          else
            echo "value=${{ needs.release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build platform matrix
        id: matrix
        run: |
          PLATFORMS="${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64' }}"
          MATRIX='[]'
          if echo "$PLATFORMS" | grep -q "linux/amd64"; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"}]')
          fi
          if echo "$PLATFORMS" | grep -q "linux/arm64"; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","suffix":"arm64"}]')
          fi
          echo "value=$(echo "{\"include\":$MATRIX}" | jq -c .)" >> $GITHUB_OUTPUT

  docker-build:
    needs: [docker-setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docker-setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout release tag
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.docker-setup.outputs.version }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [docker-build, docker-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.docker-setup.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.docker-setup.outputs.version }}
            type=raw,value=latest

      - name: Create and push multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  cli:
    needs: [release]
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.version != ''
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: nodeira-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: nodeira-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: nodeira-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: nodeira-darwin-arm64
          - goos: windows
            goarch: amd64
            artifact: nodeira-windows-amd64.exe
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Build
        working-directory: apps/cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=v${{ needs.release.outputs.version }}" -o ${{ matrix.artifact }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: apps/cli/${{ matrix.artifact }}

  desktop:
    needs: [release]
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.version != '' &&
      needs.release.outputs.desktop_changed == 'true'
    strategy:
      # Without this, one platform's maker failing cancels the others mid-flight and the
      # release silently ships a partial set of desktop artifacts.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Cache node-gyp headers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\node-gyp\Cache
          key: node-gyp-windows-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: node-gyp-windows-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native maker deps (macOS)
        if: runner.os == 'macOS'
        run: npm rebuild macos-alias fs-xattr

      - name: Build web app
        run: pnpm --filter @nodeira/web run build

      # Forge stamps artifact names and OS package metadata from apps/desktop/package.json,
      # which semantic-release never bumps — v1.12.1 shipped `Nodeira-0.0.1-arm64.dmg`.
      - name: Stamp release version into the desktop manifest
        run: pnpm --filter @nodeira/desktop run stamp-version

      # Non-fatal on purpose: the Squirrel maker has failed on GitHub's Windows runners
      # ("The system cannot find the file specified" out of Squirrel's bundled helpers)
      # while succeeding on local Windows. A broken installer maker must not cost us the
      # portable archive too. The outcome is surfaced in the job summary below, and
      # collect-artifacts still fails the job if NOTHING was produced.
      - name: Make Electron artifacts
        id: make
        continue-on-error: true
        run: pnpm --filter @nodeira/desktop run make

      - name: Collect artifacts under stable names
        run: pnpm --filter @nodeira/desktop run collect-artifacts

      - name: Report maker outcome
        shell: bash
        run: |
          {
            echo "### Desktop artifacts — ${{ matrix.os }}"
            if [ "${{ steps.make.outcome }}" = "failure" ]; then
              echo "⚠️ \`electron-forge make\` FAILED — installer missing, portable archive still published."
            else
              echo "✅ \`electron-forge make\` succeeded."
            fi
            echo ""
            ls -1sh apps/desktop/out/release
          } >> "$GITHUB_STEP_SUMMARY"

      # Squirrel writes its own log next to its vendored binaries. Without this the only
      # evidence of a Windows failure is a .NET stack trace with no inner detail.
      - name: Upload Squirrel log on failure
        if: steps.make.outcome == 'failure' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-log-${{ matrix.os }}
          path: "**/electron-winstaller/vendor/Squirrel-Releasify.log"
          if-no-files-found: warn
          retention-days: 14

      # Explicit directory, not `out/make/**/*`: on Windows the Squirrel maker also emits an
      # unpacked `nodeira-<version>-full/lib/net45/` tree, and that glob would have attached
      # every .pak, .dll and locale file in it to the release.
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: apps/desktop/out/release/*

  # Signed Android APK for the self-hosted F-Droid repo. Built on every release (the web
  # editor bundle is embedded in the APK, so it changes even when only apps/web changed).
  # Delegated to the reusable workflow so the heavy Gradle/SDK setup lives in one place.
  android:
    needs: [release]
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
