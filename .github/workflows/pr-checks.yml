name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

  cli-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Build CLI
        working-directory: apps/cli
        run: go build -o /dev/null .

      - name: Vet
        working-directory: apps/cli
        run: go vet ./...

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The suite existed but ran nowhere: it is not part of `pnpm test`, and no workflow
    # invoked it. It had already silently broken — its health check called a guarded route
    # unauthenticated — and nothing noticed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodeira
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nodeira
      JWT_SECRET: ci-secret-that-is-long-enough-to-pass-validation
      API_BASE_URL: http://localhost:3001
      WEB_BASE_URL: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @nodeira/e2e exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm --filter @nodeira/api exec prisma migrate deploy

      - name: Start API and web
        run: |
          pnpm --filter @nodeira/api run dev > /tmp/api.log 2>&1 &
          pnpm --filter @nodeira/web run dev > /tmp/web.log 2>&1 &
          npx --yes wait-on http://localhost:3001/api/v1/setup/status http://localhost:5173 --timeout 180000

      - name: Run e2e
        run: pnpm run test:e2e

      - name: Server logs on failure
        if: failure()
        run: tail -100 /tmp/api.log /tmp/web.log

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo carried a .pre-commit-config.yaml defining gitleaks, but git's
      # core.hooksPath points at .husky/, so it never ran anywhere. This is the
      # enforcement point; .husky/pre-commit runs it locally when installed.
      #
      # The binary, not gitleaks/gitleaks-action@v2: that action refuses to run on an
      # organization repo without a paid GITLEAKS_LICENSE and exits 1. It failed on every
      # PR since this job was added — a scan that never scanned anything. The tool itself
      # is MIT-licensed and has no such restriction.
      - name: Install gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          GITLEAKS_VERSION: 8.24.3

      - name: gitleaks
        run: gitleaks detect --redact --no-banner --verbose

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
