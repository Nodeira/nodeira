repos:
  # ─── General utility hooks ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict    # block accidental merge conflict markers
      - id: check-json              # validate JSON syntax
        exclude: tsconfig.*\.json$
      - id: check-yaml              # validate YAML syntax
      - id: detect-private-key      # catch accidentally committed private keys
      - id: end-of-file-fixer       # ensure files end with a newline
        exclude: \.tsbuildinfo$
      - id: trailing-whitespace     # strip trailing whitespace

  # ─── Secret scanning ─────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  # ─── Local hooks ─────────────────────────────────────────────────────────
  - repo: local
    hooks:
      # Formatting (pre-commit) — runs Prettier only on staged TS/TSX/JSON/MD files
      - id: prettier
        name: Prettier
        language: system
        entry: pnpm dlx prettier --write
        types_or: [ts, tsx, json, markdown]
        exclude: ^(CHANGELOG\.md|pnpm-lock\.yaml)$
        stages: [pre-commit]

      # Linting (pre-commit) — runs ESLint across all packages via Turborepo
      - id: eslint
        name: ESLint
        language: system
        entry: pnpm run lint
        pass_filenames: false
        types_or: [ts, tsx]
        stages: [pre-commit]

      # Type-check (pre-commit) — fan-out via Turborepo to every workspace
      - id: typecheck
        name: TypeScript
        language: system
        entry: pnpm run typecheck
        pass_filenames: false
        types_or: [ts, tsx]
        stages: [pre-commit]

      # Commit message format (commit-msg) — enforces Conventional Commits
      # Requires: pnpm add -D @commitlint/cli @commitlint/config-conventional
      - id: commitlint
        name: Commitlint
        language: system
        entry: pnpm exec commitlint --edit
        stages: [commit-msg]

      # Tests (pre-push) — runs server unit tests before any push
      - id: server-tests
        name: Server unit tests
        language: system
        entry: bash -c 'cd apps/api && pnpm run test'
        pass_filenames: false
        stages: [pre-push]
