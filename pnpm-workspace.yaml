packages:
  - "apps/*"
  - "packages/*"

# Note: apps/mobile is now a native Android (Kotlin/Gradle) project — not a pnpm package —
# so it's ignored by the workspace despite the apps/* glob (no package.json).

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/engines"
  - "@scarf/scarf"
  - better-sqlite3
  - core-js
  - core-js-pure
  - electron
  # Runs select-7z-arch.js to alias vendor/7z-<arch>.{exe,dll} → 7z.{exe,dll};
  # without this the Squirrel maker fails to extract the nupkg ("system cannot
  # find the file specified").
  - electron-winstaller
  - esbuild
  - leveldown
  - prisma
