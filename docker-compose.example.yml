# ─── Nodeira – self-hosted AI-enhanced notes ──────────────────────────────────
#
# Quick start:
#   1. Copy this file:  cp docker-compose.example.yml docker-compose.yml
#   2. Change the passwords marked with CHANGE_ME
#   3. Set APP_URL to the address where Nodeira will be accessed
#   4. Run:  docker compose up -d
#
# The app will be available at http://localhost:3001
# API docs are at http://localhost:3001/docs
# ──────────────────────────────────────────────────────────────────────────────

services:
  nodeira:
    image: ghcr.io/nodeira/nodeira:latest
    hostname: nodeira
    container_name: nodeira
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:CHANGE_ME@postgres:5432/nodeira
      CORS_ORIGIN: http://localhost:3001   # set to your domain if accessed remotely
      # PORT: 3001                         # change if you remap the port above
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: nodeira-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: nodeira
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
