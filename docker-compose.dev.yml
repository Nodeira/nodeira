services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: nodeira-postgres
    environment:
      POSTGRES_DB: nodeira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodeira"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
